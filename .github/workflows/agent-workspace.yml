name: agent-workspace
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - '.claude/**'
      - '.github/instructions/**'
      - '.github/copilot-instructions.md'
      - 'docs/**'
      - 'config/**'
      - 'scripts/validate_workspace.py'
      - '.github/workflows/agent-workspace.yml'
  push:
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - '.claude/**'
      - '.github/instructions/**'
      - '.github/copilot-instructions.md'
      - 'docs/**'
      - 'config/**'
      - 'scripts/validate_workspace.py'
      - '.github/workflows/agent-workspace.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/validate_workspace.py
