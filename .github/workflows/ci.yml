name: ci
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q
  install-unix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: One-line installer from local checkout
        run: SWARM_NO_OPEN=1 SWARM_NO_SERVICE=1 SWARM_PORT=8123 GEMINI_API_KEY= sh ./install.sh
      - name: Health
        run: curl -fsS http://127.0.0.1:8123/health
      - name: Icon helpers exist
        run: test -x swarm-open && test -f ui/icon-512.png
  install-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: install.ps1
        shell: powershell
        env:
          SWARM_HOME: ${{ github.workspace }}
          SWARM_PORT: "8123"
          SWARM_NO_OPEN: "1"
          GEMINI_API_KEY: "ci-placeholder"
        run: ./install.ps1
      - name: Health
        shell: powershell
        run: (Invoke-WebRequest http://127.0.0.1:8123/health -UseBasicParsing).StatusCode
  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cd ios && xcodegen
      - run: cd ios && xcodebuild -project Swarm.xcodeproj -scheme Swarm -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - run: cd android && gradle --no-daemon assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Swarm.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Swarm-apk
          path: Swarm.apk
  install-ish:
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - run: apk add --no-cache curl git
      - uses: actions/checkout@v4
      - name: Alpine (iSH path) installer
        run: SWARM_FORCE_ISH=1 SWARM_NO_OPEN=1 SWARM_PORT=8123 GEMINI_API_KEY= sh ./install.sh
      - name: Health
        run: curl -fsS http://127.0.0.1:8123/health
  ios-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cd ios && xcodegen
      - run: |
          cd ios
          xcodebuild -project Swarm.xcodeproj -scheme Swarm -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/Swarm.app Payload/
          zip -qry Swarm-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Swarm-unsigned-ipa
          path: ios/Swarm-unsigned.ipa
