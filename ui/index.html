<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Swarm Detection</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="theme-color" content="#05060f" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Swarm" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  :root{
    --bg:#05060f; --ink:#e8ecff; --mute:#8b93b8; --glass:rgba(18,22,48,.55); --edge:rgba(140,160,255,.18);
    --cyan:#3ef2ff; --violet:#9b5cff; --pink:#ff4fd8; --lime:#5dffb0; --red:#ff3d6e; --amber:#ffb547;
    --holo:linear-gradient(115deg,#3ef2ff,#9b5cff 35%,#ff4fd8 60%,#5dffb0 85%,#3ef2ff);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;margin:0;color:var(--ink);background:transparent;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  /* background: drifting aurora, perspective grid, grain */
  .bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  .bg i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(70px);opacity:.55;mix-blend-mode:screen;animation:drift 26s ease-in-out infinite alternate}
  .bg i:nth-child(1){background:var(--violet);top:-20vmax;left:-20vmax}
  .bg i:nth-child(2){background:var(--cyan);bottom:-25vmax;right:-25vmax;animation-duration:32s;animation-delay:-8s}
  .bg i:nth-child(3){background:var(--pink);top:30%;left:45%;width:38vmax;height:38vmax;opacity:.22;animation-duration:22s;animation-delay:-4s}
  .bg b{position:absolute;left:-50%;right:-50%;bottom:-10%;height:55%;background-image:linear-gradient(rgba(62,242,255,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(62,242,255,.16) 1px,transparent 1px);background-size:48px 48px;transform:perspective(500px) rotateX(62deg);transform-origin:bottom;mask-image:linear-gradient(to top,#000 10%,transparent 85%);-webkit-mask-image:linear-gradient(to top,#000 10%,transparent 85%);animation:grid 6s linear infinite}
  .bg u{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
  @keyframes drift{to{transform:translate(12vmax,8vmax) scale(1.15)}}
  @keyframes grid{to{background-position:0 48px,0 0}}
  main{max-width:720px;margin:auto;padding:1rem;padding-top:max(1.2rem,env(safe-area-inset-top));padding-bottom:max(2rem,env(safe-area-inset-bottom))}
  h1{margin:.4rem 0 1rem;font-size:clamp(1.9rem,6vw,2.6rem);font-weight:800;letter-spacing:-.02em;background:var(--holo);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:holo 8s linear infinite;filter:drop-shadow(0 0 18px rgba(155,92,255,.45))}
  h1::before{content:"";display:inline-block;width:.42em;height:.42em;margin-right:.45em;vertical-align:.12em;border-radius:50%;background:var(--lime);box-shadow:0 0 12px var(--lime),0 0 28px var(--lime);animation:pulse 2s ease-in-out infinite}
  h3{margin:.1rem 0 .7rem;font-size:.82rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
  @keyframes holo{to{background-position:300% 0}}
  @keyframes pulse{50%{opacity:.45;transform:scale(.8)}}
  /* glass cards with a holographic rim */
  .card{position:relative;background:var(--glass);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--edge);border-radius:18px;padding:1.1rem;margin:.85rem 0;box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);animation:rise .5s cubic-bezier(.2,.8,.2,1) both;overflow:hidden}
  .card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:var(--holo);background-size:300% 100%;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.35;animation:holo 10s linear infinite;pointer-events:none}
  .card::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.07),transparent);transform:skewX(-20deg);animation:sheen 7s ease-in-out infinite;pointer-events:none}
  @keyframes sheen{0%,70%{left:-60%}100%{left:130%}}
  @keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}}
  input,select,button{font:inherit;padding:.75rem .9rem;margin:.3rem 0;width:100%;border-radius:12px;color:var(--ink)}
  input,select{background:rgba(5,8,25,.6);border:1px solid var(--edge);outline:none;transition:border-color .2s,box-shadow .2s}
  input::placeholder{color:#5f678f}
  input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(62,242,255,.18),0 0 22px rgba(62,242,255,.25)}
  select option{background:#0b0e22}
  button{position:relative;border:0;cursor:pointer;font-weight:700;letter-spacing:.01em;color:#04060f;background:linear-gradient(120deg,var(--cyan),var(--violet));box-shadow:0 6px 24px rgba(62,242,255,.28),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
  button:hover{filter:brightness(1.12);box-shadow:0 8px 34px rgba(155,92,255,.45)}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.45;filter:grayscale(.6);cursor:default}
  button.sec{color:var(--ink);background:rgba(120,140,255,.1);border:1px solid var(--edge);box-shadow:none;backdrop-filter:blur(8px)}
  button.sec:hover{border-color:var(--cyan);box-shadow:0 0 20px rgba(62,242,255,.22)}
  button.del{color:#fff;background:linear-gradient(120deg,var(--red),var(--pink));box-shadow:0 6px 22px rgba(255,61,110,.3)}
  #addall{background:linear-gradient(120deg,var(--lime),var(--cyan));animation:glow 2.4s ease-in-out infinite}
  @keyframes glow{50%{box-shadow:0 0 34px rgba(93,255,176,.55)}}
  .row{display:flex;gap:.55rem;align-items:flex-end}.row>*{flex:1;min-width:0}
  .count{font-size:2.4rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(62,242,255,.5))}
  small{color:var(--mute);word-break:break-word;font-size:.8rem}
  #err{color:var(--red);text-shadow:0 0 12px rgba(255,61,110,.5);margin:.3rem 0}
  #banner{text-align:center;font-size:1.25rem;font-weight:700;padding:1.3rem;letter-spacing:.01em}
  /* swarm alarm: red holo pulse */
  .alarm{background:linear-gradient(135deg,rgba(255,61,110,.32),rgba(255,79,216,.18)) ,var(--glass);border-color:rgba(255,61,110,.7);animation:rise .5s both,alarm 1.1s ease-in-out infinite}
  .alarm::before{background:linear-gradient(115deg,var(--red),var(--pink),var(--amber),var(--red));opacity:.9}
  .alarm .count{background:linear-gradient(180deg,#fff,var(--red));-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 16px rgba(255,61,110,.8))}
  .alarm small{color:#ffd0dc}
  @keyframes alarm{50%{box-shadow:0 0 0 1px rgba(255,61,110,.6),0 0 46px rgba(255,61,110,.55),0 10px 40px rgba(0,0,0,.45)}}
  .off{background:linear-gradient(135deg,rgba(255,181,71,.25),rgba(255,79,216,.1)),var(--glass);border-color:rgba(255,181,71,.6);color:#ffe3b8}
  #offline{display:none;text-align:center;font-weight:700}
  .ev{font-size:.88rem;padding:.45rem 0;border-bottom:1px solid rgba(140,160,255,.1);color:#c9cff0}
  .ev:first-child{color:#fff}
  video{display:none}
  img.live{width:100%;border-radius:12px;margin:.55rem 0;background:#000;min-height:40px;border:1px solid rgba(62,242,255,.35);box-shadow:0 0 0 1px rgba(155,92,255,.15),0 0 30px rgba(62,242,255,.18)}
  .alarm img.live{border-color:rgba(255,61,110,.8);box-shadow:0 0 30px rgba(255,61,110,.45)}
  #found button{margin:.25rem 0}
  /* camera cards are rebuilt on every refresh: no entrance animation there (prevents flicker) */
  #list .card{animation:none}
  #list .alarm{animation:alarm 1.1s ease-in-out infinite}
  #list .card::after{display:none}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  /* extra 3D holographic layers */
  .bg::before{content:"";position:absolute;inset:-20%;background:radial-gradient(ellipse at 20% 30%,rgba(62,242,255,.18),transparent 50%),radial-gradient(ellipse at 80% 70%,rgba(155,92,255,.16),transparent 55%),radial-gradient(ellipse at 50% 50%,rgba(255,79,216,.08),transparent 40%);animation:aurora 18s ease-in-out infinite alternate;mix-blend-mode:screen}
  .bg .orb{position:absolute;width:18vmax;height:18vmax;border-radius:50%;filter:blur(40px);opacity:.35;mix-blend-mode:screen;animation:float 14s ease-in-out infinite}
  .bg .orb:nth-child(6){background:var(--cyan);top:10%;left:15%;animation-delay:-3s}
  .bg .orb:nth-child(7){background:var(--violet);top:60%;right:10%;width:22vmax;height:22vmax;animation-delay:-7s}
  .bg .orb:nth-child(8){background:var(--lime);bottom:15%;left:40%;width:14vmax;height:14vmax;animation-delay:-11s}
  .bg .particles{position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px,rgba(62,242,255,.7) 0,transparent 70%),radial-gradient(1px 1px,rgba(255,79,216,.5) 0,transparent 60%),radial-gradient(1px 1px,rgba(93,255,176,.4) 0,transparent 50%);background-size:120px 120px,180px 180px,90px 90px;animation:stars 40s linear infinite;opacity:.6}
  @keyframes aurora{to{transform:translate(8%,-6%) scale(1.1) rotate(3deg)}}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6vmax,-8vmax) scale(1.2)}}
  @keyframes stars{to{background-position:120px 120px, -180px 90px, 45px -90px}}
  .card{transform-style:preserve-3d;perspective:800px;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
  .card:hover{transform:translateY(-6px) rotateX(4deg) rotateY(-2deg);box-shadow:0 20px 50px rgba(0,0,0,.5),0 0 40px rgba(62,242,255,.15)}
  .card::before{padding:1.5px;opacity:.55}
  h1{filter:drop-shadow(0 0 22px rgba(155,92,255,.6)) drop-shadow(0 0 40px rgba(62,242,255,.3));animation:holo 6s linear infinite,titleGlow 3s ease-in-out infinite}
  @keyframes titleGlow{50%{filter:drop-shadow(0 0 28px rgba(255,79,216,.7)) drop-shadow(0 0 50px rgba(62,242,255,.4))}}
  button{box-shadow:0 6px 24px rgba(62,242,255,.35),inset 0 1px 0 rgba(255,255,255,.4);background-size:200% 100%;animation:btnShift 4s ease infinite}
  @keyframes btnShift{0%,100%{background-position:0 0}50%{background-position:100% 0}}
  img.live{box-shadow:0 0 0 1px rgba(155,92,255,.25),0 0 40px rgba(62,242,255,.25),inset 0 0 20px rgba(0,0,0,.4);transition:box-shadow .3s}
  .alarm{animation:alarm 1s ease-in-out infinite,alarmPulse 2s ease-in-out infinite}
  @keyframes alarmPulse{50%{transform:scale(1.015)}}
  .scanline{position:fixed;inset:0;z-index:5;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 4px);mix-blend-mode:overlay;opacity:.4}

</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <i></i><i></i><i></i><b></b><u></u>
  <div class="orb"></div><div class="orb"></div><div class="orb"></div>
  <div class="particles"></div>
</div>
<div class="scanline" aria-hidden="true"></div>
<main>
  <h1>Swarm Detection</h1>
  <div id="offline" class="card off"></div>
  <div id="err"></div>

  <div id="login" class="card" hidden>
    <h3>Sign in</h3>
    <input id="u" placeholder="Username" value="admin" autocomplete="username" />
    <input id="p" type="password" placeholder="Password (ADMIN_PASS in .env)" autocomplete="current-password" />
    <button id="go">Sign in</button>
  </div>

  <div id="app" hidden>
    <div id="banner" class="card"></div>
    <div class="card row">
      <div><small>Combined swarm alert at (people, 0 = off)</small><input id="tt" type="number" min="0" value="0" /></div>
      <div><small>&nbsp;</small><button id="tts" class="sec">Save</button></div>
    </div>

    <div id="list"></div>

    <div class="card">
      <h3>Recent alerts</h3>
      <div id="events"><small>None yet</small></div>
    </div>

    <div class="card" id="addcard">
      <h3>Add camera</h3>
      <input id="curl" placeholder="Camera IP (192.168.1.20), rtsp://…, http://…, or 0 for USB webcam" />
      <div class="row"><input id="cu" placeholder="Camera username (optional)" autocomplete="off" /><input id="cp" type="password" placeholder="Camera password" autocomplete="new-password" /></div>
      <div class="row">
        <select id="brand"><option value="generic">Brand: auto‑detect</option><option>onvif</option><option>hikvision</option><option>dahua</option><option>amcrest</option><option>axis</option><option>reolink</option><option>tapo</option><option>foscam</option><option>unifi</option></select>
        <input id="thr" type="number" min="1" value="10" title="People that trigger an alert" />
      </div>
      <small id="tip"></small>
      <input id="cid" placeholder="Name (optional, e.g. front-door)" />
      <button id="add">Add camera</button>
      <div class="row"><button id="scan" class="sec">Scan network for cameras</button><button id="phone" class="sec">Use this device's camera</button></div>
      <div id="found"></div>
    </div>

    <div class="card">
      <div id="remote"><small>Remote access: checking…</small></div>
      <button id="pushbtn" class="sec">Enable alerts on this device</button>
      <small id="pushmsg"></small>
      <button id="install" class="sec" hidden>Install app on this device</button>
      <small id="ioshint" hidden>iPhone/iPad: tap <b>Share</b> → <b>Add to Home Screen</b>.</small>
    </div>
    <button id="out" class="sec">Sign out</button>
  </div>
</main>
<video id="vid" playsinline muted></video>
<script>
const $ = id => document.getElementById(id);
const thumbs = {};
let token = null, audio = null, phoneTimer = null, tick = null, n = 0, installEvt = null;
try { token = localStorage.getItem("swarm_token"); } catch (e) {}
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

async function api(path, opts = {}) {
  const h = { ...(opts.headers || {}) };
  if (token) h.Authorization = "Bearer " + token;
  if (!(opts.body instanceof Blob)) h["Content-Type"] = "application/json";
  const r = await fetch(path, { ...opts, headers: h });
  if (r.status === 401 && token) { setToken(null); throw new Error("Session expired – sign in again"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || r.statusText);
  return j;
}
function setToken(t) { token = t; try { t ? localStorage.setItem("swarm_token", t) : localStorage.removeItem("swarm_token"); } catch (e) {} render(); }
function err(e) { $("err").textContent = e ? (e.message || e) : ""; }
function beep() {
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain(); o.connect(g); g.connect(audio.destination);
    o.frequency.value = 880; g.gain.value = .2; o.start(); o.stop(audio.currentTime + .4); } catch (e) {}
}
function notify(msg) { try { if (window.Notification && Notification.permission === "granted") new Notification("Swarm alert", { body: msg, icon: "icon-192.png", tag: "swarm" }); } catch (e) {} }
function when(ts) { return new Date(ts).toLocaleString(); }

async function pairFromHash() { // "#key=<password>" from the installer's QR/link: sign in once, then hide the key
  const m = /[#&]key=([^&]+)/.exec(location.hash || ""); if (!m) return;
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  try {
    const r = await fetch(`/login?username=admin&password=${m[1]}`, { method: "POST" });
    if (r.ok) { token = (await r.json()).access_token; try { localStorage.setItem("swarm_token", token); } catch (e) {} }
  } catch (e) {}
}
async function render() {
  clearInterval(tick);
  if (!token) await pairFromHash();
  if (!token) { // browser on the server machine itself: sign in automatically
    try { const r = await fetch("/local-token"); if (r.ok) { token = (await r.json()).access_token; try { localStorage.setItem("swarm_token", token); } catch (e) {} } } catch (e) {}
  }
  $("login").hidden = !!token; $("app").hidden = !token;
  if (!token) return;
  await refresh(); tick = setInterval(refresh, 2000);
}

let lastStatus = { cameras: [] };
function draw(s, ev, offlineTs) {
  lastStatus = s || lastStatus;
  const b = $("banner");
  b.className = "card" + (s.alarm && !offlineTs ? " alarm" : "");
  b.textContent = offlineTs ? `Last known: ${s.total} people across ${s.cameras.length} camera(s)` :
    (s.alarm ? `⚠ SWARM DETECTED – ${s.total} people in view` : `All clear – ${s.total} people in view across ${s.cameras.length} camera(s)`);
  if (document.activeElement !== $("tt")) $("tt").value = s.total_threshold;
  const keep = document.activeElement && document.activeElement.closest("#list");
  if (!keep) {
    $("list").innerHTML = "";
    s.cameras.forEach(c => {
      const d = document.createElement("div"); d.className = "card" + (c.alarm && !offlineTs ? " alarm" : "");
      d.innerHTML = `<div class="row"><b></b><span class="count" style="text-align:right"></span></div><img class="live" alt=""><small class="u"></small><br><small class="st"></small>
        <div class="row"><input type="number" min="1" title="Alert threshold"><button class="sv">Save threshold</button><button class="del">Remove</button></div>`;
      d.querySelector("b").textContent = `${c.id} (${c.brand})`;
      d.querySelector(".count").textContent = c.count === null ? "–" : c.count;
      const im = d.querySelector("img.live"); im.dataset.id = c.id; if (thumbs[c.id]) im.src = thumbs[c.id]; else im.style.display = "none";
      d.querySelector(".u").textContent = c.resolved || c.url;
      d.querySelector(".st").textContent = c.status;
      const inp = d.querySelector("input"); inp.value = c.threshold;
      const sv = d.querySelector(".sv"), del = d.querySelector(".del");
      if (offlineTs) { sv.disabled = del.disabled = inp.disabled = true; }
      sv.onclick = () => api(`/cameras/${encodeURIComponent(c.id)}/threshold`, { method: "PUT", body: JSON.stringify({ threshold: +inp.value }) }).then(refresh, err);
      del.onclick = () => { if (c.brand === "phone") stopPhone(); api(`/cameras/${encodeURIComponent(c.id)}`, { method: "DELETE" }).then(refresh, err); };
      $("list").appendChild(d);
    });
  }
  if (!s.cameras.length && !offlineTs && !window.__scanned) { window.__scanned = true; $("scan").click(); }
  const evEl = $("events"); evEl.innerHTML = "";
  (ev || []).slice(0, 30).forEach(e => { const d = document.createElement("div"); d.className = "ev"; d.textContent = `${when(e.ts * 1000)} – ${e.label}: ${e.count} people`; evEl.appendChild(d); });
  if (!ev || !ev.length) evEl.innerHTML = "<small>None yet</small>";
}

async function refreshThumbs(cams) {
  for (const c of cams) {
    try {
      const r = await fetch(`/cameras/${encodeURIComponent(c.id)}/snapshot`, { headers: { Authorization: "Bearer " + token } });
      if (!r.ok) continue;
      const url = URL.createObjectURL(await r.blob()), old = thumbs[c.id]; thumbs[c.id] = url;
      document.querySelectorAll(`img.live[data-id="${CSS.escape(c.id)}"]`).forEach(im => { im.src = url; im.style.display = ""; });
      if (old) URL.revokeObjectURL(old);
    } catch (x) {}
  }
}
async function refresh() {
  try {
    const [s, e] = await Promise.all([api("/status"), api("/events")]);
    $("offline").style.display = "none"; $("addcard").style.opacity = 1;
    if (s.alarm && !(window.__lastAlarm)) notify(`${s.total} people detected`);
    if (s.alarm) beep(); window.__lastAlarm = s.alarm;
    draw(s, e.events, 0);
    refreshThumbs(s.cameras);
    const snap = { ts: Date.now(), status: s, events: e.events };
    lsSet("swarm_cache", snap);
    try { window.webkit.messageHandlers.swarmCache.postMessage(JSON.stringify(snap)); } catch (x) {}
    err("");
    if (n++ % 10 === 0) api("/remote").then(r => { $("remote").innerHTML = ""; const sm = document.createElement("small");
      sm.textContent = r.url ? "Remote link (anywhere, login required): " + r.url : (r.enabled ? "Remote access starting…" : "Remote access off (reinstall with SWARM_REMOTE=1 to enable)"); $("remote").appendChild(sm); }, () => {});
  } catch (x) {
    const c = lsGet("swarm_cache");
    if (c && token) {
      $("offline").style.display = "block"; $("offline").textContent = `OFFLINE – server unreachable. Showing last known state from ${when(c.ts)}. Retrying…`;
      $("addcard").style.opacity = .4;
      draw(c.status, c.events, c.ts); err("");
    } else err(x);
  }
}
$("go").onclick = async () => {
  beep(); try { if (window.Notification && Notification.permission === "default") Notification.requestPermission(); } catch (e) {}
  try {
    const r = await fetch(`/login?username=${encodeURIComponent($("u").value)}&password=${encodeURIComponent($("p").value)}`, { method: "POST" });
    const j = await r.json(); if (!r.ok) throw new Error(j.detail);
    err(""); setToken(j.access_token);
  } catch (e) { err(e); }
};
$("tts").onclick = () => api("/settings", { method: "PUT", body: JSON.stringify({ total_threshold: +$("tt").value }) }).then(refresh, err);
$("add").onclick = () => {
  const a = $("curl").value.trim(); if (!a) return err("Enter a camera address");
  const id = $("cid").value.trim() || ("cam-" + a.replace(/[^a-z0-9]+/gi, "-").slice(0, 24));
  api(`/cameras/${encodeURIComponent(id)}`, { method: "POST", body: JSON.stringify({ url: a, brand: $("brand").value, username: $("cu").value, password: $("cp").value, threshold: +$("thr").value }) })
    .then(() => { err(""); $("curl").value = ""; $("cp").value = ""; refresh(); }, err);
};
const TIPS = {
  generic: "Most cameras: turn on ONVIF or RTSP in the camera's own app, then use the camera's username/password. Not supported (no local video): Ring, Nest, Arlo, Blink, most Eufy, stock Wyze.",
  onvif: "Use the camera's ONVIF user (some brands need ONVIF switched on in their app first).",
  hikvision: "Hikvision: use the camera's admin login. RTSP is on by default.",
  dahua: "Dahua: use the admin login. RTSP is on by default.",
  amcrest: "Amcrest: use the admin login. RTSP is on by default.",
  axis: "Axis: use an Axis user account (viewer or admin).",
  reolink: "Reolink: if it won't connect, turn on RTSP/ONVIF in the Reolink app (network / advanced / server settings) and use the camera's admin login.",
  tapo: "Tapo: in the Tapo app open the camera > Settings > Advanced settings > Camera account, create a username/password and use that here (not your TP-Link login).",
  foscam: "Foscam: use the camera's admin account.",
  unifi: "UniFi Protect: enable RTSP for the camera in Protect (camera > Settings > Advanced), then paste the rtsp:// link here.",
};
const showTip = b => { $("tip").textContent = TIPS[b] || TIPS.generic; };
$("brand").onchange = () => showTip($("brand").value); showTip("generic");
$("scan").onclick = async () => {
  $("found").textContent = "Scanning your network (about 10 s)…";
  try {
    const { devices } = await api("/discover");
    $("found").innerHTML = devices.length ? "" : "No cameras found. Enter the address manually.";
    const have = new Set((lastStatus.cameras || []).map(c => c.url));
    const fresh = devices.filter(d => !have.has(d.ip));
    if (fresh.length) {
      const all = document.createElement("button"); all.id = "addall"; all.textContent = `Add all ${fresh.length} found camera${fresh.length > 1 ? "s" : ""}`;
      all.onclick = async () => {
        all.disabled = true; let ok = 0, bad = [];
        for (const d of fresh) {
          try { await api(`/cameras/${encodeURIComponent((d.brand || "cam") + "-" + d.ip.split(".").pop())}`, { method: "POST", body: JSON.stringify({ url: d.ip, brand: d.brand || $("brand").value, username: $("cu").value, password: $("cp").value, threshold: +$("thr").value }) }); ok++; }
          catch (e) { bad.push(d.ip); }
        }
        $("found").textContent = `Added ${ok} camera${ok === 1 ? "" : "s"}.` + (bad.length ? ` Failed: ${bad.join(", ")}.` : "") + " Cameras that need a password show 'connecting' until you enter the username/password above and add them again.";
        refresh();
      };
      $("found").appendChild(all);
    }
    devices.forEach(d => { const b = document.createElement("button"); b.className = "sec"; b.textContent = `${have.has(d.ip) ? "Added: " : "Use "}${d.ip} – ${d.hint}`; b.disabled = have.has(d.ip); b.onclick = () => { $("curl").value = d.ip; if (d.brand) $("brand").value = d.brand; showTip(d.brand || $("brand").value); $("cu").focus(); }; $("found").appendChild(b); });
  } catch (e) { $("found").textContent = ""; err(e); }
};
function stopPhone() { clearInterval(phoneTimer); phoneTimer = null; const v = $("vid"); if (v.srcObject) v.srcObject.getTracks().forEach(t => t.stop()); v.srcObject = null; }
$("phone").onclick = async () => {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return err("Browser camera needs HTTPS or localhost (use the Remote link, or install with SWARM_HTTPS=1).");
  try {
    stopPhone();
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1280 } } });
    const v = $("vid"); v.srcObject = stream; await v.play();
    const id = "phone-" + Math.random().toString(36).slice(2, 6);
    await api(`/cameras/${id}`, { method: "POST", body: JSON.stringify({ url: "phone", brand: "phone", threshold: +$("thr").value }) });
    const cv = document.createElement("canvas");
    phoneTimer = setInterval(() => {
      cv.width = 640; cv.height = Math.round(640 * v.videoHeight / v.videoWidth) || 360;
      cv.getContext("2d").drawImage(v, 0, 0, cv.width, cv.height);
      cv.toBlob(b => b && api(`/cameras/${id}/frame`, { method: "POST", body: b, headers: { "Content-Type": "image/jpeg" } }).catch(() => {}), "image/jpeg", .7);
    }, 1000);
    err(""); refresh();
  } catch (e) { err(e); }
};
$("out").onclick = () => { stopPhone(); setToken(null); };

// phone push alerts (iPhone: needs the https link + app added to Home Screen)
function b64(k) { const p = "=".repeat((4 - k.length % 4) % 4), r = atob((k + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from([...r].map(c => c.charCodeAt(0))); }
$("pushbtn").onclick = async () => {
  const m = $("pushmsg");
  if (!window.isSecureContext) return m.textContent = "Alerts need https: open the Remote link (or install with SWARM_HTTPS=1).";
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return m.textContent = "On iPhone: tap Share → Add to Home Screen, then open Swarm from the Home Screen and try again.";
  try {
    if (await Notification.requestPermission() !== "granted") return m.textContent = "Notifications were not allowed.";
    const reg = await navigator.serviceWorker.ready, { key } = await api("/push/key");
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(key) });
    await api("/push/subscribe", { method: "POST", body: JSON.stringify(sub.toJSON()) });
    m.textContent = "Alerts enabled on this device ✔";
  } catch (x) { m.textContent = "Could not enable alerts: " + (x.message || x); }
};

// install-to-home-screen
const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; $("install").hidden = false; });
$("install").onclick = async () => { if (installEvt) { installEvt.prompt(); installEvt = null; $("install").hidden = true; } };
if (/iPad|iPhone|iPod/.test(navigator.userAgent) && !standalone) $("ioshint").hidden = false;

render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
