<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/coden607/swarm/main/ui/apple-touch-icon.png" />
  <title>Swarm Detection – One‑Click Installer</title>
  <style>
    body{font-family:system-ui,Arial,sans-serif;margin:0;padding:1rem;background:#f5f5f5}
    .c{max-width:640px;margin:auto;background:#fff;padding:1.5rem;border-radius:8px;box-shadow:0 2px 8px #0002}
    h1{text-align:center;font-size:1.4rem}
    pre{background:#111;color:#e6e6e6;padding:.75rem;border-radius:6px;overflow-x:auto;white-space:pre-wrap;word-break:break-all}
    button,a.go{display:block;width:100%;box-sizing:border-box;padding:.8rem;margin:.4rem 0;background:#2b8a3e;color:#fff;border:0;border-radius:4px;font-size:1rem;cursor:pointer;text-align:center;text-decoration:none}
    button.sec,a.sec{background:#555}
    .hint{color:#555;font-size:.9rem}
  </style>
</head>
<body>
<div class="c">
  <h1>Swarm Detection – One‑Click Install</h1>
  <p class="hint" id="detected"></p>
  <pre id="cmd"></pre>
  <div id="actions" hidden></div>
  <a id="termux" href="https://f-droid.org/packages/com.termux/" style="display:none;margin:.5rem 0;text-align:center" class="hint"><b>Step 1 – Get Termux (F‑Droid)</b></a>
  <noscript><p class="hint"><a href="/install.mobileconfig">Install Swarm on iPhone</a> (enable JavaScript for other systems).</p></noscript>
  <button id="copy">Copy command</button>
  <p class="hint">Or download and double‑click:
    <a href="https://github.com/coden607/swarm/raw/main/Install-Windows.bat">Windows</a> ·
    <a href="https://github.com/coden607/swarm/raw/main/Install-Mac.command">macOS</a> ·
    <a href="https://github.com/coden607/swarm/raw/main/Install-Linux.sh">Linux</a></p>
  <p class="hint" id="steps"></p>
  <hr />
  <p class="hint">Other systems: <a href="#" data-os="unix">Linux / macOS</a> · <a href="#" data-os="android">Android</a> · <a href="#" data-os="win">Windows</a> · <a href="#" data-os="ios">iPhone / iPad</a></p>
</div>
<script>
  const RAW = 'https://raw.githubusercontent.com/coden607/swarm/main';
  const OS = {
    unix: { name: 'Linux / macOS / Android (Termux)', cmd: `curl -fsSL ${RAW}/install.sh | sh`,
      steps: 'Open a terminal (on Android: install Termux from F‑Droid first), paste, press Enter. Adds a desktop/app icon and prints the URL, login and QR code. Prefix with SWARM_REMOTE=1 for a public link.' },
    android: { name: 'Android', cmd: `pkg upgrade -y -o Dpkg::Options::=--force-confold && pkg install -y curl && curl -fsSL ${RAW}/install.sh | sh`,
      steps: '1) Install Termux from F‑Droid (button above; not the Play Store version). 2) Open Termux, paste the command, press Enter. 3) Open the printed address in Chrome → menu → Install app. If another computer/Pi already runs Swarm, skip Termux: just open its https link in Chrome → Install app → Enable alerts.' },
    win: { name: 'Windows', cmd: `irm ${RAW}/install.ps1 | iex`,
      steps: 'Open PowerShell (Administrator recommended so the firewall port opens), paste, press Enter. Adds a Desktop and Start Menu icon.' },
    ios: { name: 'iPhone / iPad', cmd: '',
      steps: '' }
  };
  const ua = navigator.userAgent || '';
  let key = /iPad|iPhone|iPod/.test(ua) ? 'ios' : /Android/.test(ua) ? 'android' : /Win/.test(ua) ? 'win' : 'unix';
  function show(k) {
    const o = OS[k];
    document.getElementById('detected').textContent = 'Detected / selected: ' + o.name;
    document.getElementById('cmd').textContent = o.cmd;
    document.getElementById('steps').textContent = o.steps;
    const ios = k === 'ios';
    document.getElementById('cmd').hidden = ios;
    document.getElementById('copy').hidden = ios;
    document.getElementById('actions').hidden = !ios;
    document.getElementById('termux').style.display = k === 'android' ? 'block' : 'none';
    if (ios) renderIos();
  }
  const IPA = encodeURIComponent('https://github.com/coden607/swarm/releases/download/apk/Swarm-unsigned.ipa');
  const SIDESTORE_IPA_FILE = 'https://github.com/SideStore/SideStore/releases/latest/download/SideStore.ipa';
  const SIDESTORE_IPA = encodeURIComponent(SIDESTORE_IPA_FILE);
  const SIDESTORE_SETUP = 'https://docs.sidestore.io/docs/installation/install';
  const hosted = /^https?:$/.test(location.protocol) && !/jsdelivr\.net|github\.io|githubusercontent\.com/.test(location.host);
  let iosStep = 0, leftApp = false, native = false;
  function rememberRetry() { try { sessionStorage.setItem('swarm-retry-native', '1'); } catch (e) {} }
  function openSigner(scheme) {
    native = true;
    leftApp = false;
    iosStep = 1;
    renderIos();
    location.href = scheme + '://install?url=' + IPA;
    setTimeout(() => { if (!leftApp && iosStep === 1) installSideStore(); }, 1400);
  }
  function installSideStore() {
    native = true;
    leftApp = false;
    iosStep = 11;
    rememberRetry();
    renderIos();
    location.href = 'altstore://install?url=' + SIDESTORE_IPA;
    setTimeout(() => {
      if (leftApp || iosStep !== 11) return;
      location.href = SIDESTORE_IPA_FILE;
      setTimeout(() => {
        if (iosStep === 11 && document.visibilityState === 'visible') location.href = SIDESTORE_SETUP;
      }, 900);
    }, 1400);
  }
  function oneClick() {
    if (hosted && !native) {
      iosStep = 10;
      renderIos();
      location.href = '/install.mobileconfig';
      return;
    }
    openSigner('sidestore');
  }
  function renderIos() {
    const actions = document.getElementById('actions');
    const signIn = 'Uses the Apple ID already saved in SideStore or AltStore. If that app asks you to sign in, use the same Apple ID this iPhone uses. Swarm never sees the password.';
    if (iosStep === 0) {
      actions.innerHTML = hosted
        ? `<button type="button" id="go-one">Install Swarm</button>
           <p class="hint">One tap. Safari opens Settings; tap <b>Install</b>. Swarm lands on the Home Screen and opens this server.</p>
           <button type="button" id="go-side" class="sec">Native app instead (SideStore)</button>
           <p class="hint">${signIn} If SideStore is missing, this installs it.</p>`
        : `<button type="button" id="go-one">Install Swarm</button>
           <p class="hint">${signIn} SideStore opens and installs Swarm. If SideStore is not on this iPhone, the same tap installs SideStore (via AltStore if you have it, otherwise the official SideStore IPA and setup page), then retries Swarm when you come back.</p>
           <p class="hint">Already running a Swarm server? Open <code>http://&lt;server&gt;:8000/install</code> on this iPhone for a Home Screen icon with no extra app.</p>`;
      document.getElementById('go-one').onclick = oneClick;
      const side = document.getElementById('go-side');
      if (side) side.onclick = () => openSigner('sidestore');
    } else if (iosStep === 10) {
      actions.innerHTML = `<p class="hint">Safari should have opened Settings. Tap <b>Install</b>, then Done. Swarm is on the Home Screen.</p>
        <button type="button" id="go-one">Try Install Swarm again</button>
        <button type="button" id="go-side" class="sec">Native app instead (SideStore)</button>`;
      document.getElementById('go-one').onclick = oneClick;
      document.getElementById('go-side').onclick = () => openSigner('sidestore');
    } else if (iosStep === 11) {
      actions.innerHTML = `<p class="hint">SideStore was not on this iPhone. Installing it now: AltStore if you already use it, otherwise Safari downloads <a href="${SIDESTORE_IPA_FILE}">SideStore.ipa</a> and opens the <a href="${SIDESTORE_SETUP}">official setup</a> (iloader on a computer, once). Come back here and Swarm installs itself.</p>
        <button type="button" id="go-side">Try SideStore again</button>
        <a class="go" href="${SIDESTORE_IPA_FILE}">Download SideStore.ipa</a>
        <a class="go sec" href="${SIDESTORE_SETUP}">Open SideStore setup</a>
        ${hosted ? '<button type="button" id="go-one" class="sec">Home Screen icon instead</button>' : ''}`;
      document.getElementById('go-side').onclick = () => openSigner('sidestore');
      const one = document.getElementById('go-one');
      if (one) one.onclick = () => { native = false; oneClick(); };
    } else if (iosStep === 1) {
      actions.innerHTML = `<p class="hint">SideStore should be open. Confirm the install. If it asks for an Apple ID, use the one already on this iPhone. Come back here when the app is on the Home Screen.</p>`;
    } else if (iosStep === 2) {
      actions.innerHTML = `<p class="hint">Apple requires one tap that no app can do for you. Open Settings → General → VPN &amp; Device Management, tap the Apple ID that signed Swarm, then Trust.</p>
        <button type="button" id="trusted">I trusted Swarm</button>`;
      document.getElementById('trusted').onclick = () => { iosStep = 3; renderIos(); };
    } else {
      actions.innerHTML = `<p class="hint">Open Swarm on the Home Screen. It looks for your server on the Wi‑Fi by itself. A free Apple ID expires the app in about 7 days; open SideStore or AltStore and it refreshes with the same saved login.</p>`;
    }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') leftApp = true;
    if (document.visibilityState === 'visible' && leftApp) {
      if (iosStep === 1) { iosStep = 2; renderIos(); }
      if (iosStep === 11) { leftApp = false; openSigner('sidestore'); }
    }
  });
  document.querySelectorAll('[data-os]').forEach(a => a.onclick = e => { e.preventDefault(); show(a.dataset.os); });
  document.getElementById('copy').onclick = () => {
    navigator.clipboard.writeText(document.getElementById('cmd').textContent).then(
      () => document.getElementById('copy').textContent = 'Copied ✔',
      () => document.getElementById('copy').textContent = 'Select the text above and copy manually');
  };
  show(key);
  try {
    if (key === 'ios' && sessionStorage.getItem('swarm-retry-native') === '1') {
      sessionStorage.removeItem('swarm-retry-native');
      native = true;
      openSigner('sidestore');
    }
  } catch (e) {}
</script>
</body>
</html>
