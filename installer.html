<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swarm Detection – One‑Click Installer</title>
  <style>
    body{font-family:system-ui,Arial,sans-serif;margin:0;padding:1rem;background:#f5f5f5}
    .c{max-width:640px;margin:auto;background:#fff;padding:1.5rem;border-radius:8px;box-shadow:0 2px 8px #0002}
    h1{text-align:center;font-size:1.4rem}
    pre{background:#111;color:#e6e6e6;padding:.75rem;border-radius:6px;overflow-x:auto;white-space:pre-wrap;word-break:break-all}
    button{width:100%;padding:.8rem;background:#2b8a3e;color:#fff;border:0;border-radius:4px;font-size:1rem;cursor:pointer}
    .hint{color:#555;font-size:.9rem}
  </style>
</head>
<body>
<div class="c">
  <h1>Swarm Detection – One‑Click Install</h1>
  <p class="hint" id="detected"></p>
  <pre id="cmd"></pre>
  <button id="copy">Copy command</button>
  <p class="hint">Or download and double‑click:
    <a href="https://github.com/coden607/swarm/raw/main/Install-Windows.bat">Windows</a> ·
    <a href="https://github.com/coden607/swarm/raw/main/Install-Mac.command">macOS</a> ·
    <a href="https://github.com/coden607/swarm/raw/main/Install-Linux.sh">Linux</a></p>
  <p class="hint" id="steps"></p>
  <hr />
  <p class="hint">Other systems: <a href="#" data-os="unix">Linux / macOS / Termux</a> · <a href="#" data-os="win">Windows</a> · <a href="#" data-os="ios">iPhone / iPad</a></p>
</div>
<script>
  const RAW = 'https://raw.githubusercontent.com/coden607/swarm/main';
  const OS = {
    unix: { name: 'Linux / macOS / Android (Termux)', cmd: `curl -fsSL ${RAW}/install.sh | sh`,
      steps: 'Open a terminal (on Android: install Termux from F‑Droid first), paste, press Enter. Adds a desktop/app icon and prints the URL, login and QR code. Prefix with SWARM_REMOTE=1 for a public link.' },
    win: { name: 'Windows', cmd: `irm ${RAW}/install.ps1 | iex`,
      steps: 'Open PowerShell (Administrator recommended so the firewall port opens), paste, press Enter. Adds a Desktop and Start Menu icon.' },
    ios: { name: 'iPhone / iPad', cmd: 'Install on a PC, Mac, Linux box or Android phone first, then open its URL (http://HOST_IP:8000) in Safari',
      steps: 'Tap Share → Add to Home Screen. iOS cannot run the service itself; the app is a client. Native test app: see ios/README.md in the repo.' }
  };
  const ua = navigator.userAgent || '';
  let key = /iPad|iPhone|iPod/.test(ua) ? 'ios' : /Win/.test(ua) ? 'win' : 'unix';
  function show(k) {
    const o = OS[k];
    document.getElementById('detected').textContent = 'Detected / selected: ' + o.name;
    document.getElementById('cmd').textContent = o.cmd;
    document.getElementById('steps').textContent = o.steps;
    document.getElementById('copy').hidden = k === 'ios';
  }
  document.querySelectorAll('[data-os]').forEach(a => a.onclick = e => { e.preventDefault(); show(a.dataset.os); });
  document.getElementById('copy').onclick = () => {
    navigator.clipboard.writeText(document.getElementById('cmd').textContent).then(
      () => document.getElementById('copy').textContent = 'Copied ✔',
      () => document.getElementById('copy').textContent = 'Select the text above and copy manually');
  };
  show(key);
</script>
</body>
</html>
